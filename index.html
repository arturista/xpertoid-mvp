<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Xpertoid - RPG Social</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main id="app">
        <header>
            <h1>Xpertoid</h1>
            <p id="status-msg">Conectado ao servidor</p>
        </header>

        <section id="profile-section"></section>

        <section id="content">
            <nav class="tabs">
                <button onclick="showTab('quest-tab')">Missões</button>
                <button onclick="showTab('feed-tab')">Feed</button>
                <button onclick="showTab('leaderboard-tab')">Ranking</button>
            </nav>
            
            <div id="quest-tab" class="tab-content">
                <button id="btn-abrir-camera">📸 Nova Missão</button>
                <div id="container-missoes"></div>
            </div>
            
            <div id="feed-tab" class="tab-content hidden">
                <div id="container-feed"></div>
            </div>

            <div id="leaderboard-tab" class="tab-content hidden">
                <div id="container-leaderboard"></div>
            </div>
        </section>
    </main>

    <div id="modal-camera" class="hidden">
        <video id="video-feed" autoplay playsinline></video>
        <div class="camera-controls">
            <button id="btn-capturar">Capturar</button>
            <button id="btn-cancelar">Cancelar</button>
        </div>
    </div>

    <script type="module" src="script.js"></script>
</body>
</html>
